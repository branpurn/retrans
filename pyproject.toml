[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retrans"
version = "0.1.0"
description = "RETRANS: operator-run live restream bridge (YouTube → X Media Studio RTMP)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "RETRANS" }]
# Operator tools (ffmpeg, yt-dlp, streamlink) are invoked as subprocesses, not imported.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
retrans = "retrans.cli:main"

[tool.setuptools.packages.find]
include = ["retrans*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
