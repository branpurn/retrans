<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RETRANS</title>
  </head>
  <body>
    <div id="app">
      <header class="bar">
        <h1 class="brand">RETRANS</h1>
        <p id="status-pill" class="pill" data-status="idle">Idle</p>
      </header>

      <main class="body">
        <section id="beat-1" class="beat" data-beat="1" aria-labelledby="signin-title">
          <h2 id="signin-title" class="title">Sign in</h2>
          <p id="signin-helper" class="helper">Save Media Studio RTMP once. Not X OAuth.</p>
          <label class="field-label" for="rtmp_url">RTMP URL</label>
          <input
            id="rtmp_url"
            name="rtmp_url"
            type="text"
            spellcheck="false"
            autocomplete="off"
          />
          <label class="field-label" for="rtmp_key">Stream key</label>
          <input
            id="rtmp_key"
            name="rtmp_key"
            type="password"
            spellcheck="false"
            autocomplete="off"
          />
          <button id="save-btn" class="btn-primary" type="button">Save</button>
        </section>

        <section id="beat-2" class="beat hidden" data-beat="2" aria-labelledby="drop-title">
          <h2 id="drop-title" class="title">Drop link</h2>
          <input
            id="source_url"
            name="source_url"
            type="text"
            inputmode="url"
            spellcheck="false"
            autocomplete="off"
            placeholder="Paste YouTube live URL"
          />
          <button id="preview-btn" type="button">Preview</button>
          <p id="paste-helper" class="helper hidden">YouTube first</p>
          <div id="preview-card" class="preview-card hidden" data-preview>
            <div class="preview-filled">
              <div class="thumb-wrap">
                <img class="preview-thumb" alt="" />
                <span class="preview-live-badge live-badge hidden">LIVE</span>
              </div>
              <div class="preview-meta">
                <h2 class="title preview-title"></h2>
                <p class="helper preview-host"></p>
              </div>
            </div>
          </div>
          <label class="ack">
            <input id="ack" name="ack" type="checkbox" />
            <span>I have permission or fair use to retransmit this live.</span>
          </label>
          <button id="continue-btn" class="btn-primary" type="button" disabled>Continue</button>
          <a id="change-dest" class="change-dest" href="#">Change destination</a>
        </section>

        <section id="beat-3" class="beat hidden" data-beat="3" aria-label="Retrans">
          <div id="preview-card-compact" class="preview-card preview-card--compact hidden" data-preview>
            <div class="preview-filled">
              <div class="thumb-wrap">
                <img class="preview-thumb" alt="" />
                <span class="preview-live-badge live-badge hidden">LIVE</span>
              </div>
              <div class="preview-meta">
                <h2 class="title preview-title"></h2>
                <p class="helper preview-host"></p>
              </div>
            </div>
          </div>
          <div class="row">
            <button id="start-btn" class="btn-start" type="button" disabled>
              Start live retrans
            </button>
            <button id="stop-btn" class="btn-stop" type="button" disabled>Stop</button>
          </div>
          <p id="transport-helper" class="helper">Idle until ready</p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
