# Publish the operator image to GHCR and cut a GitHub Release on a version tag.
# Triggers: push of v* tags, or workflow_dispatch. Never on pull_request.
# Auth is GITHUB_TOKEN only (packages: write). Do not add stream keys or PATs.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (default: latest)"
        required: false
        default: "latest"

permissions:
  contents: write
  packages: write

concurrency:
  group: ghcr-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: GHCR operator image
    if: github.repository == 'branpurn/retrans'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image tag
        id: tag
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.tag }}"
            tag="${tag:-latest}"
          fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "refusing image tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/branpurn/retrans" >> "$GITHUB_OUTPUT"

      - name: Build
        run: docker build -t retrans:release .

      - name: Live tools (ffmpeg, yt-dlp, streamlink) and dist/
        run: |
          docker run --rm --entrypoint bash retrans:release -c '
            set -euo pipefail
            test -f /app/dist/index.html
            command -v ffmpeg
            command -v yt-dlp
            command -v streamlink
            ffmpeg -version | head -n1
            yt-dlp --version
            streamlink --version
          '

      - name: Compose still one-port loopback
        run: |
          test "$(docker compose --profile loopback config --services | wc -l)" -eq 1
          docker compose --profile loopback config | grep -F 'ghcr.io/branpurn/retrans'
          docker compose --profile loopback config | grep -F 'network_mode: host'
          docker compose --profile loopback config | grep -F '127.0.0.1'
          ! docker compose --profile loopback config | grep -E '5173|8788:8788|0\.0\.0\.0'

      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          set -euo pipefail
          IMAGE="${{ steps.tag.outputs.image }}"
          TAG="${{ steps.tag.outputs.tag }}"
          docker tag retrans:release "${IMAGE}:${TAG}"
          docker push "${IMAGE}:${TAG}"
          if [[ "$TAG" != "latest" ]]; then
            docker tag retrans:release "${IMAGE}:latest"
            docker push "${IMAGE}:latest"
          fi

      - name: Public package (unauthenticated pull)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/users/branpurn/packages/container/retrans/visibility" \
            -f visibility=public

      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          IMAGE="${{ steps.tag.outputs.image }}"
          notes="$(mktemp)"
          {
            echo "Operator image: \`${IMAGE}:${TAG}\`"
            echo
            echo '```bash'
            echo "docker pull ${IMAGE}:${TAG}"
            echo "RETRANS_IMAGE_TAG=${TAG} docker compose --profile loopback up"
            echo '```'
            echo
            echo "Operator URL: http://127.0.0.1:8788 only. Host network. Never 0.0.0.0. No published 8788:8788. Not Vite 5173."
            echo "Loopback is one service and does not start the live worker."
          } > "$notes"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" docker-compose.yml --clobber
            gh release edit "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" docker-compose.yml \
              --title "RETRANS ${TAG}" \
              --notes-file "$notes" \
              --verify-tag
          fi
