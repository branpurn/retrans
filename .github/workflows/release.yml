# Publish the operator image to GHCR and cut a GitHub Release on a version tag.
# Triggers: push of v* tags, or workflow_dispatch. Never on pull_request.
# Auth is GITHUB_TOKEN only (packages: write). Do not add stream keys or PATs.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (default: latest)"
        required: false
        default: "latest"

permissions:
  contents: write
  packages: write

concurrency:
  group: ghcr-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: GHCR operator image
    if: github.repository == 'branpurn/retrans'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image tag
        id: tag
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.tag }}"
            tag="${tag:-latest}"
          fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "refusing image tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/branpurn/retrans" >> "$GITHUB_OUTPUT"

      - name: Build
        run: docker build -t retrans:release .

      - name: Live tools (ffmpeg, yt-dlp, streamlink) and dist/
        run: |
          docker run --rm --entrypoint bash retrans:release -c '
            set -euo pipefail
            test -f /app/dist/index.html
            command -v ffmpeg
            command -v yt-dlp
            command -v streamlink
            ffmpeg -version | head -n1
            yt-dlp --version
            streamlink --version
          '

      - name: Compose still one-port loopback
        run: |
          test "$(docker compose --profile loopback config --services | wc -l)" -eq 1
          docker compose --profile loopback config | grep -F 'ghcr.io/branpurn/retrans'
          docker compose --profile loopback config | grep -F 'host_ip: 127.0.0.1'
          docker compose --profile loopback config | grep -F 'published: "8788"'
          docker compose --profile loopback config | grep -F 'target: 8788'
          docker compose --profile loopback config | grep -F 'init: true'
          ! docker compose --profile loopback config | grep -F '5173'
          ! docker compose --profile loopback config | grep -F 'network_mode: host'
          ! docker compose --profile loopback config | grep -F '0.0.0.0:8788'
          grep -F '127.0.0.1:8788:8788' docker-compose.yml
          grep -F 'HOST: "0.0.0.0"' docker-compose.yml
          ! grep -F 'network_mode: host' docker-compose.yml
          ! grep -E '^[[:space:]]*-[[:space:]]*"?0\.0\.0\.0:8788' docker-compose.yml

      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          set -euo pipefail
          IMAGE="${{ steps.tag.outputs.image }}"
          TAG="${{ steps.tag.outputs.tag }}"
          docker tag retrans:release "${IMAGE}:${TAG}"
          docker push "${IMAGE}:${TAG}"
          if [[ "$TAG" != "latest" ]]; then
            docker tag retrans:release "${IMAGE}:latest"
            docker push "${IMAGE}:latest"
          fi

      # Visibility PUT is best-effort (GITHUB_TOKEN often cannot flip it).
      # The gate is an unauthenticated GHCR manifest GET for the published tag.
      # Bare GET is GHCR's 401 challenge; public means an anonymous token
      # (no GITHUB_TOKEN, no docker login, no PAT) can GET the manifest as HTTP 200.
      - name: Public package (unauthenticated pull)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          IMAGE_REPO="branpurn/retrans"
          MANIFEST_URL="https://ghcr.io/v2/branpurn/retrans/manifests/${TAG}"
          ACCEPT="application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json"

          put_rc=0
          put_out="$(
            gh api --method PUT \
              -H "Accept: application/vnd.github+json" \
              "/users/branpurn/packages/container/retrans/visibility" \
              -f visibility=public 2>&1
          )" || put_rc=$?
          if [[ "$put_rc" -eq 0 ]]; then
            echo "GITHUB_TOKEN visibility PUT accepted."
          else
            echo "GITHUB_TOKEN visibility PUT did not set public (exit ${put_rc}). That is common."
            printf '%s\n' "$put_out"
          fi

          docker logout ghcr.io >/dev/null 2>&1 || true

          token_body="$(mktemp)"
          manifest_body="$(mktemp)"
          code=""
          token_code=""
          attempt=1
          while [[ "$attempt" -le 5 ]]; do
            token_code="$(
              env -u GITHUB_TOKEN -u GH_TOKEN -u GH_ENTERPRISE_TOKEN \
                curl -sS --netrc-file /dev/null \
                  -o "$token_body" -w "%{http_code}" \
                  "https://ghcr.io/token?service=ghcr.io&scope=repository:${IMAGE_REPO}:pull"
            )"
            token="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("token",""))' "$token_body" 2>/dev/null || true)"

            if [[ -n "$token" ]]; then
              code="$(
                env -u GITHUB_TOKEN -u GH_TOKEN -u GH_ENTERPRISE_TOKEN \
                  curl -sS --netrc-file /dev/null \
                    -H "Authorization: Bearer ${token}" \
                    -H "Accept: ${ACCEPT}" \
                    -o "$manifest_body" -w "%{http_code}" \
                    "$MANIFEST_URL"
              )"
            else
              code="$(
                env -u GITHUB_TOKEN -u GH_TOKEN -u GH_ENTERPRISE_TOKEN \
                  curl -sS --netrc-file /dev/null \
                    -H "Accept: ${ACCEPT}" \
                    -o "$manifest_body" -w "%{http_code}" \
                    "$MANIFEST_URL"
              )"
            fi

            echo "Unauthenticated GHCR manifest GET ${MANIFEST_URL} -> HTTP ${code} (token endpoint HTTP ${token_code}, attempt ${attempt})"
            if [[ "$code" == "200" ]]; then
              echo "Package is anonymously pullable (HTTP 200)."
              exit 0
            fi
            # 401 after a failed PUT: package is still private; GITHUB_TOKEN cannot flip it.
            if [[ "$code" == "401" && "$put_rc" -ne 0 ]]; then
              break
            fi
            attempt=$((attempt + 1))
            if [[ "$attempt" -le 5 ]]; then
              sleep 3
            fi
          done

          echo "Wanted HTTP 200 from unauthenticated pull of ${MANIFEST_URL}."
          echo "curl evidence: GET ${MANIFEST_URL} returned HTTP ${code}"
          echo "token endpoint HTTP ${token_code}"
          printf '%s\n' "$(head -c 500 "$manifest_body")"
          if [[ "$code" == "401" ]]; then
            echo "branpurn/retrans GHCR package must be set Public in package settings:"
            echo "  https://github.com/users/branpurn/packages/container/retrans/settings"
            echo "GITHUB_TOKEN cannot flip visibility (PUT exit ${put_rc}). Do not add a PAT."
          fi
          exit 1

      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          IMAGE="${{ steps.tag.outputs.image }}"
          notes="$(mktemp)"
          {
            echo "Operator image: \`${IMAGE}:${TAG}\`"
            echo
            echo '```bash'
            echo "docker rm -f retrans"
            echo "docker pull ${IMAGE}:${TAG}"
            echo "docker run --rm --init -p 127.0.0.1:8788:8788 ${IMAGE}:${TAG} retrans serve"
            echo '```'
            echo
            echo "Operator URL: http://127.0.0.1:8788 only. Published 127.0.0.1:8788:8788. Never 0.0.0.0:8788 on the host. Not host network. Not Vite 5173."
            echo "Loopback is one service and does not start the live worker."
          } > "$notes"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" docker-compose.yml --clobber
            gh release edit "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" docker-compose.yml \
              --title "RETRANS ${TAG}" \
              --notes-file "$notes" \
              --verify-tag
          fi
