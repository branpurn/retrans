name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    name: Docker live image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t retrans:ci .
      - name: Compose file
        run: docker compose config
      - name: Compose live profile
        run: docker compose --profile live config
      - name: Compose loopback profile
        run: docker compose --profile loopback config
      - name: Live tools (ffmpeg, yt-dlp, streamlink)
        run: |
          docker run --rm --entrypoint bash retrans:ci -c '
            set -euo pipefail
            command -v ffmpeg
            command -v yt-dlp
            command -v streamlink
            ffmpeg -version | head -n1
            yt-dlp --version
            streamlink --version
          '

  python:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        if: hashFiles('pyproject.toml') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        if: hashFiles('pyproject.toml') != ''
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest
      - name: No package yet
        if: hashFiles('pyproject.toml') == ''
        run: echo "pyproject.toml not present; Docker live-image job is the Wave 1 gate."

  loopback-host:
    name: Loopback HOST refuse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HOST=0.0.0.0 is refused (no bind)
        run: |
          set +e
          output="$(HOST=0.0.0.0 ./scripts/loopback.sh 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output"
          test "$code" -ne 0
          printf '%s\n' "$output" | grep -Eiq '127\.0\.0\.1|refuse'
      - name: HOST=127.0.0.1 is allowed by the guard
        run: |
          # Guard only — no retrans/npm on PATH, so children never start.
          set +e
          output="$(PATH=/usr/bin:/bin HOST=127.0.0.1 ./scripts/loopback.sh 2>&1)"
          set -e
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Eivq 'refusing HOST'
          printf '%s\n' "$output" | grep -Eiq 'retrans not on PATH|npm not on PATH'
      - name: Script probes 127.0.0.1:8788 before UI
        run: |
          grep -F '127.0.0.1:8788' scripts/loopback.sh
          grep -E 'api/live/status|/dev/tcp' scripts/loopback.sh
