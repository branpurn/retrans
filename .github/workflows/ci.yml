name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    name: Docker live image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t retrans:ci .
      - name: Compose file
        run: docker compose config
      - name: Compose live profile
        run: |
          docker compose --profile live config
          docker compose --profile live config | grep -F 'ghcr.io/branpurn/retrans'
          ! docker compose --profile live config | grep -E 'ports:|8788:8788|0\.0\.0\.0'
          # No container_name — concurrent keyed workers stay allowed.
          ! docker compose --profile live config | grep -F 'container_name:'
      - name: Compose loopback profile
        run: |
          docker compose --profile loopback config
          # ONE service — GHCR image, no Vite ui / 5173, no published 8788:8788
          test "$(docker compose --profile loopback config --services | wc -l)" -eq 1
          ! docker compose --profile loopback config --services | grep -qx ui
          ! docker compose --profile loopback config | grep -E '5173|8788:8788|0\.0\.0\.0'
          docker compose --profile loopback config | grep -F 'ghcr.io/branpurn/retrans'
          docker compose --profile loopback config | grep -F 'network_mode: host'
          docker compose --profile loopback config | grep -F '127.0.0.1'
      - name: Release workflow publishes GHCR (no PR push, no extra secrets)
        run: |
          test -f .github/workflows/release.yml
          grep -F 'workflow_dispatch' .github/workflows/release.yml
          grep -F 'packages: write' .github/workflows/release.yml
          grep -F 'GITHUB_TOKEN' .github/workflows/release.yml
          grep -F 'ghcr.io/branpurn/retrans' .github/workflows/release.yml
          grep -E "tags:|'v\*'|\"v\*\"" .github/workflows/release.yml
          ! grep -E '^[[:space:]]*pull_request:' .github/workflows/release.yml
          extra="$(grep -oE 'secrets\.[A-Z0-9_]+' .github/workflows/release.yml | grep -v GITHUB_TOKEN || true)"
          test -z "$extra"
      - name: Live tools (ffmpeg, yt-dlp, streamlink) and dist/
        run: |
          docker run --rm --entrypoint bash retrans:ci -c '
            set -euo pipefail
            test -f /app/dist/index.html
            command -v ffmpeg
            command -v yt-dlp
            command -v streamlink
            ffmpeg -version | head -n1
            yt-dlp --version
            streamlink --version
          '

  python:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        if: hashFiles('pyproject.toml') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        if: hashFiles('pyproject.toml') != ''
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest
      - name: No package yet
        if: hashFiles('pyproject.toml') == ''
        run: echo "pyproject.toml not present; Docker live-image job is the Wave 1 gate."

  loopback-host:
    name: Loopback HOST refuse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HOST=0.0.0.0 is refused (no bind)
        run: |
          set +e
          output="$(HOST=0.0.0.0 ./scripts/loopback.sh 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output"
          test "$code" -ne 0
          printf '%s\n' "$output" | grep -Eiq '127\.0\.0\.1|refuse'
      - name: HOST=127.0.0.1 is allowed by the guard
        run: |
          # Guard only — no retrans/npm on PATH, so children never start.
          set +e
          output="$(PATH=/usr/bin:/bin HOST=127.0.0.1 ./scripts/loopback.sh 2>&1)"
          set -e
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Eivq 'refusing HOST'
          printf '%s\n' "$output" | grep -Eiq 'retrans not on PATH'
      - name: Script probes 127.0.0.1:8788 (no Vite)
        run: |
          grep -F '127.0.0.1:8788' scripts/loopback.sh
          grep -E 'api/live/status|/dev/tcp' scripts/loopback.sh
          ! grep -F 'npm run dev' scripts/loopback.sh
