name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    name: Docker live image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t retrans:ci .
      - name: Compose file
        run: docker compose config
      - name: Live tools (ffmpeg, yt-dlp, streamlink)
        run: |
          docker run --rm --entrypoint bash retrans:ci -c '
            set -euo pipefail
            command -v ffmpeg
            command -v yt-dlp
            command -v streamlink
            ffmpeg -version | head -n1
            yt-dlp --version
            streamlink --version
          '

  python:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        if: hashFiles('pyproject.toml') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install, lint, test
        if: hashFiles('pyproject.toml') != ''
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          ruff check .
          pytest
      - name: No package yet
        if: hashFiles('pyproject.toml') == ''
        run: echo "pyproject.toml not present; Docker live-image job is the Wave 1 gate."
