# Operator-run live worker. Outbound RTMP(S) only — no host port published.
# Wave 1 is a long-running live pipeline, not a clip-only batch job.
# X credentials stay in .env (gitignored). Copy .env.example → .env.
# Image: ghcr.io/branpurn/retrans (GitHub Release tag or latest).
#
# Operator (pull + one compose): `RETRANS_IMAGE_TAG=<tag> docker compose --profile loopback up`
#   ONE service: retrans serve, published 127.0.0.1:8788:8788 (dist/ + /api, same-origin).
#   Does not start the live ffmpeg worker. Does not start Vite.
#   Host bind is 127.0.0.1 only — never 0.0.0.0 / LAN / hotspot. Not host network
#   (rootless Docker does not put host-net 8788 on the real host 127.0.0.1).
#   HOST=0.0.0.0 is inside the container only so the published mapping works.
#   Backend must accept HOST=0.0.0.0 in-container; host never binds 0.0.0.0:8788.
# Operator docker run (same publish mapping, not --network host):
#   docker rm -f retrans
#   docker pull ghcr.io/branpurn/retrans:latest
#   docker run --rm --init -p 127.0.0.1:8788:8788 IMAGE retrans serve
# Live / headless worker (keyed): `docker compose --profile live up` or
#   `docker compose --profile headless up -d` (same service, no host bind).
#   Loopback profile does not start this worker.
#   No keys → entrypoint idles (does not start ffmpeg). No container_name so
#   more than one keyed worker can run.
# Headless docker run (no -p, not --network host; halt with docker stop):
#   docker pull ghcr.io/branpurn/retrans:latest
#   docker run --init --env-file .env --name retrans-headless IMAGE
services:
  retrans:
    profiles: ["live", "headless"]
    image: ghcr.io/branpurn/retrans:${RETRANS_IMAGE_TAG:-latest}
    build: .
    env_file:
      - path: .env
        required: false
    init: true
    restart: unless-stopped
    stop_grace_period: 15s

  serve:
    profiles: ["loopback"]
    image: ghcr.io/branpurn/retrans:${RETRANS_IMAGE_TAG:-latest}
    build: .
    command: retrans serve
    ports:
      - "127.0.0.1:8788:8788"
    environment:
      HOST: "0.0.0.0"
      PORT: "8788"
    env_file:
      - path: .env
        required: false
    init: true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf --max-time 2 http://127.0.0.1:8788/api/live/status || bash -c 'echo >/dev/tcp/127.0.0.1/8788'",
        ]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 3s
